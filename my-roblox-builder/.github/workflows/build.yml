name: Build Client EXE

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'App Password'
        required: true
      download_link:
        description: 'Download Link'
        required: true
      loop:
        description: 'Loop Count'
        required: true
      build_id:
        description: 'Unique Build ID'
        required: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyInstaller & Requests
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests

      - name: Inject Configuration
        shell: powershell
        run: |
          $code = Get-Content app_client.py -Raw -Encoding UTF8
          $code = $code -replace 'CONFIG_PASSWORD = "MA_MAT_KHAU_CUA_BAN"', 'CONFIG_PASSWORD = "${{ github.event.inputs.password }}"'
          $code = $code -replace 'DOWNLOAD_LINK = "LINK_DOWNLOAD_FILE_CUA_BAN"', 'DOWNLOAD_LINK = "${{ github.event.inputs.download_link }}"'
          $code = $code -replace 'MAX_LOOP = 5', 'MAX_LOOP = ${{ github.event.inputs.loop }}'
          Set-Content -Path client_build.py -Value $code -Encoding UTF8

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --noconsole --name="RobloxAnDanh_MadeByKhoa" client_build.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: exe-${{ github.event.inputs.build_id }}
          path: dist/RobloxAnDanh_MadeByKhoa.exe
          retention-days: 1
