name: Build Executable

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'App Password'
        required: true
      download_link:
        description: 'Download Link'
        required: true
      loop:
        description: 'Loop Count'
        required: true
      build_id:
        description: 'Build ID'
        required: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests

      - name: Inject Variables and Build EXE
        shell: powershell
        run: |
          # 1. Tìm file app_client.py trong thư mục gốc hoặc trong my-roblox-builder/
          $targetFile = "app_client.py"
          if (-not (Test-Path $targetFile)) {
              if (Test-Path "my-roblox-builder/app_client.py") {
                  $targetFile = "my-roblox-builder/app_client.py"
              } else {
                  Write-Error "Không tìm thấy file app_client.py!"
                  exit 1
              }
          }

          # 2. Đọc nội dung file client gốc
          $code = Get-Content $targetFile -Raw -Encoding UTF8

          # 3. Thay thế các thông số được truyền từ Web
          $code = $code -replace 'APP_PASSWORD\s*=\s*".*?"', 'APP_PASSWORD = "${{ github.event.inputs.password }}"'
          $code = $code -replace 'DOWNLOAD_LINK\s*=\s*".*?"', 'DOWNLOAD_LINK = "${{ github.event.inputs.download_link }}"'
          $code = $code -replace 'LOOP_COUNT\s*=\s*\d+', 'LOOP_COUNT = ${{ github.event.inputs.loop }}'

          # 4. Tạo file tạm app_client_ready.py trên máy ảo
          Set-Content -Path "app_client_ready.py" -Value $code -Encoding UTF8

          # 5. Đóng gói thành file EXE bằng PyInstaller (dùng --noconsole để ẩn cửa sổ CMD)
          pyinstaller --onefile --noconsole --name "RobloxAnDanh_MadeByKhoa" app_client_ready.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: exe-${{ github.event.inputs.build_id }}
          path: dist/RobloxAnDanh_MadeByKhoa.exe
          retention-days: 1
